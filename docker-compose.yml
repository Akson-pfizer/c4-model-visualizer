services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLMHUB_API_KEY=${LLMHUB_API_KEY:-}
      - LLMHUB_BASE_URL=${LLMHUB_BASE_URL:-https://llmhub.platforms.pfizer/v1}
      - LLMHUB_MODEL_POWERFUL=${LLMHUB_MODEL_POWERFUL:-gpt-4o}
      - LLMHUB_MODEL_MEDIUM=${LLMHUB_MODEL_MEDIUM:-gpt-4.1-mini}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
